version: "3.9"

# CasaOS installatie — geen eigen Nginx/SSL, CasaOS regelt dat.
# Stel in CasaOS de reverse proxy in: bon.frericksonline.nl → poort 8088

services:

  frontend:
    image: ghcr.io/ffrericks/receipt-frontend:latest
    restart: unless-stopped

  backend:
    image: ghcr.io/ffrericks/receipt-backend:latest
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - APP_USER=${APP_USER}
      - APP_PASSWORD=${APP_PASSWORD}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_API_KEY=${N8N_API_KEY}
    volumes:
      - /DATA/AppData/kassabon/uploads:/app/uploads
      - /DATA/AppData/kassabon/presets:/app/presets
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - /DATA/AppData/kassabon/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - /DATA/AppData/kassabon/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
